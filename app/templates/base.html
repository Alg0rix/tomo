<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>{{ brand }} · 友達</title>
  <link rel="icon" href="{{ url_for('static', path='favicon.svg') }}" type="image/svg+xml">
  <link rel="icon" href="{{ url_for('static', path='favicon.ico') }}" sizes="any">
  <link rel="apple-touch-icon" href="{{ url_for('static', path='apple-touch-icon.png') }}">
  <script>
    // anti-flash: theme + rail collapse before CSS/paint
    (function(){
      var t = localStorage.getItem('tomo-theme') || 'dark';
      document.documentElement.setAttribute('data-theme', t);
      var rail = localStorage.getItem('tomo-app-rail');
      if (rail == null && localStorage.getItem('tomo-sessions-sidebar') === 'collapsed') rail = 'collapsed';
      if (rail === 'collapsed') document.documentElement.classList.add('is-rail-collapsed');
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', path='css/tomo.css') }}?v=hitl-collapse1">
  {% block extra_head %}{% endblock %}
</head>
<body>
<div class="app-shell">
  {% include 'partials/app_rail.html' %}
  <div class="body-row">
    <main class="canvas">
      {% block content %}{% endblock %}
    </main>
  </div>
</div>

<div id="toasts"></div>
<script src="{{ url_for('static', path='js/tomo.js') }}?v=app-rail1"></script>
{% block scripts %}{% endblock %}
</body>
</html>
