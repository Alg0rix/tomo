<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>{{ brand }} · 友達</title>
  <script>
    // anti-flash: apply theme before CSS/paint
    (function(){
      var t = localStorage.getItem('tomo-theme') || 'dark';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', path='css/tomo.css') }}">
</head>
<body>
<div class="app-shell">
  <header class="header">
    <a class="brand" href="/">
      <span class="mark">友</span>
      <span>{{ brand }}<span class="sub"> · {{ brand_subtitle | default('agent swarm') }}</span></span>
    </a>
    <button class="icon-btn nav-toggle" id="navToggle" aria-label="Menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <nav class="nav" id="nav">
      <a href="/" class="{{ 'active' if page == 'dashboard' }}">Dashboard</a>
      <a href="/sessions" class="{{ 'active' if page == 'sessions' }}">Chat</a>
      <a href="/agents" class="{{ 'active' if page in ('agents','agent') }}">Agents</a>
      <a href="/workplaces" class="{{ 'active' if page in ('workplaces','workplace') }}">Workplaces</a>
      <a href="/skills" class="{{ 'active' if page in ('skills','skill') }}">Skills</a>
      {% if eval_ui_enabled %}
      <a href="/evaluate" class="{{ 'active' if page == 'evaluate' }}">Evaluate</a>
      {% endif %}
      <a href="/scheduler" class="{{ 'active' if page == 'scheduler' }}">Scheduler</a>
      <a href="/system" class="{{ 'active' if page == 'system' }}">System</a>
    </nav>
    <div class="header-spacer"></div>
    <div class="header-tools">
      <button class="icon-btn" id="themeBtn" aria-label="Toggle theme" title="Toggle theme">
        <svg id="iconMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg id="iconSun" style="display:none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <a class="btn ghost sm" href="/logout">Logout</a>
    </div>
  </header>

  <div class="body-row">
    <aside class="rail" id="rail" aria-label="Agent swarm">
      <div class="rail-head">swarm</div>
      <div id="railList"></div>
      <a class="rail-add" href="/agents" title="Manage agents" aria-label="Manage agents">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </a>
    </aside>

    <main class="canvas">
      {% block content %}{% endblock %}
    </main>
  </div>
</div>

<div id="toasts"></div>
<script src="{{ url_for('static', path='js/tomo.js') }}"></script>
<script src="{{ url_for('static', path='js/rail.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
