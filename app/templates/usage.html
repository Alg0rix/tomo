{% extends "base.html" %}
{% block content %}
<div class="page">
  <div class="page-head">
    <div>
      <h1 class="page-title">Usage</h1>
      <p class="page-sub">Token monitor — LLM cost and usage across the swarm. <span class="badge muted">🔜 planned</span></p>
    </div>
    <a class="btn ghost sm" href="/plugins">← Plugins</a>
  </div>
  <div class="stat-grid">
    <div class="stat amber"><div class="k">Today</div><div class="v">—</div></div>
    <div class="stat sky"><div class="k">This week</div><div class="v">—</div></div>
    <div class="stat jade"><div class="k">Agents active</div><div class="v">—</div></div>
  </div>
  <div class="card"><div class="empty" style="padding:48px">Usage charts will appear when the Token Monitor plugin is wired to the coordinator runtime.</div></div>
</div>
{% endblock %}
