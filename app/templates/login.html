<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>{{ brand }} · Login</title>
  <link rel="icon" href="{{ url_for('static', path='favicon.svg') }}" type="image/svg+xml">
  <link rel="icon" href="{{ url_for('static', path='favicon.ico') }}" sizes="any">
  <link rel="apple-touch-icon" href="{{ url_for('static', path='apple-touch-icon.png') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', path='css/tomo.css') }}">
  <script>(function(){var t=localStorage.getItem('tomo-theme')||'dark';document.documentElement.setAttribute('data-theme',t);})();</script>
</head>
<body class="login-page">
  <div class="login-bloom" aria-hidden="true"></div>

  <header class="login-nav">
    <a class="login-wordmark" href="/login">
      <span class="mark">友</span>
      <span>{{ brand }}</span>
    </a>
    <button class="icon-btn" id="themeBtn" type="button" aria-label="Toggle theme" title="Toggle theme">
      <svg id="iconMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg id="iconSun" style="display:none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>

  <main class="login-letter">
    <p class="login-meta">local gate · accounts</p>
    <h1 class="login-salut">友達,</h1>
    <p class="login-lede">The swarm is locked. Sign in with your account to step inside.</p>

    {% if error %}
    <p class="login-err" id="login-error" role="alert">{{ error }}</p>
    {% endif %}

    <form class="login-form" method="post" action="/login" id="loginForm">
      <input type="hidden" name="next" value="{{ request.query_params.get('next', '/') }}">
      <div class="field" style="margin-bottom:1.25rem">
        <label class="login-label" for="username">Username</label>
        <input
          class="login-input"
          id="username"
          name="username"
          type="text"
          autocomplete="username"
          autofocus
          required
          aria-required="true"
          spellcheck="false"
          placeholder="admin"
          style="border-bottom:1px solid var(--border-strong);width:100%;min-height:44px;padding:10px 0"
        >
      </div>
      <label class="login-label" for="password">Password</label>
      <div class="login-row">
        <input
          class="login-input"
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
          aria-required="true"
          {% if error %}aria-invalid="true" aria-describedby="login-error"{% endif %}
          placeholder="••••••••"
        >
        <button class="login-submit" type="submit" id="loginSubmit">
          <span class="login-submit-label">Enter</span>
          <span class="login-submit-arrow" aria-hidden="true">→</span>
          <span class="btn-spinner" aria-hidden="true"></span>
        </button>
      </div>
    </form>
  </main>

  <footer class="login-foot">
    <p>bootstrap · <code>admin</code> / <code>TOMO_ADMIN_PASSWORD</code></p>
  </footer>

  <script src="{{ url_for('static', path='js/tomo.js') }}"></script>
  <script>
    (function () {
      var form = document.getElementById('loginForm');
      var btn = document.getElementById('loginSubmit');
      if (!form || !btn) return;
      form.addEventListener('submit', function () {
        btn.classList.add('is-loading');
        btn.setAttribute('aria-busy', 'true');
        btn.disabled = true;
      });
    })();
  </script>
</body>
</html>
