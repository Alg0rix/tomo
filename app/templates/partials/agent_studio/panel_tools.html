<div class="agent-studio-panel hidden" id="panel-tools" data-agent-id="{{ agent.id }}">
  {% from 'partials/toggle.html' import toggle %}
  <p class="faint" style="margin:0 0 12px">Enable or disable tools for this agent. Changes apply on Save.</p>
  {% for t in tools %}
  <div class="tool-row" data-tool-id="{{ t.id }}">
    <div class="meta"><div class="name">{{ t.name }}</div><div class="desc">{{ t.description }}</div></div>
    <span class="mono faint" style="font-size:11px">{{ t.backend }}</span>
    {{ toggle(checked=t.enabled, disabled=false, extra_class='tool-enable') }}
  </div>
  {% endfor %}
  <div style="margin-top:16px"><button class="btn primary sm" type="button" id="toolsSave">Save</button></div>
</div>
