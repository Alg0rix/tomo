{% macro chat_composer(placeholder='Message…', hint='', toolbar=False) %}
{# hint kept for call-site compat; footer tip text removed #}
<div class="composer{% if toolbar %} composer-float{% endif %}">
  <div class="composer-inner mention-host">
    <input type="file" class="attachment-input" multiple tabindex="-1" aria-hidden="true">
    <button class="attach-btn" type="button" aria-label="Attach files" title="Attach files">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
    </button>
    <div class="composer-field">
      <div class="attachment-preview hidden"></div>
      <textarea class="chat-input" placeholder="{{ placeholder }}" rows="1"></textarea>
    </div>
    <div class="mention-menu hidden" role="listbox" aria-label="Mention agent"></div>
    <div class="slash-menu hidden" role="listbox" aria-label="Skills"></div>
    <button class="send btn primary chat-send" type="button" disabled aria-label="Send">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3.4 20.4 20.85 12.9a1 1 0 0 0 0-1.8L3.4 3.6A1 1 0 0 0 2 4.5v5.1c0 .5.37.93.87.99L17 12 2.87 13.4c-.5.07-.87.5-.87 1v5.1a1 1 0 0 0 1.4.9z"/></svg>
    </button>
  </div>
  <div class="composer-footer">
    <button type="button" class="ctx-usage-trigger" aria-label="Context usage" aria-haspopup="dialog" aria-expanded="false" title="Context usage">
      <span class="ctx-usage-ring" style="--ctx-pct:0"><span class="ctx-usage-pct">—</span></span>
      <span class="ctx-usage-label">Context</span>
    </button>
    <div class="composer-actions">
      {% if toolbar %}
      <span class="badge ok chat-status" id="chatStatus"><span class="pulse"></span>online</span>
      {% endif %}
      <button class="btn ghost sm chat-files-btn" type="button" title="Session files / artifacts">Files</button>
      {% if toolbar %}
      <button class="btn ghost sm" id="editSwarmBtn" type="button" title="Edit participants">Agents</button>
      <button class="btn ghost sm chat-clear" id="chatClearBtn" type="button" title="Clear conversation">Clear</button>
      {% endif %}
    </div>
  </div>
</div>
{% endmacro %}
