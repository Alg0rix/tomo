<dialog id="newDlg" class="card agent-new-dialog">
  <form id="newForm" class="agent-new-form">
    <h3>New agent</h3>
    <div class="field"><label>ID <span class="faint">(snake_case)</span></label><input class="input" name="id" required pattern="[a-z0-9_]+" placeholder="research_bot"></div>
    <div class="field"><label>Name</label><input class="input" name="name" required placeholder="Research Bot"></div>
    <div class="field"><label>Description</label><input class="input" name="description" placeholder="What this agent does"></div>
    <div class="field"><label>Model</label><input class="input" name="model_id" placeholder="gpt-4o-mini"></div>
    <div class="agent-new-actions">
      <button type="button" class="btn ghost" id="newCancel">Cancel</button>
      <button type="submit" class="btn primary">Create</button>
    </div>
  </form>
</dialog>
