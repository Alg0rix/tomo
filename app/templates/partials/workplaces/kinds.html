<div class="card workplace-kinds">
  <div class="card-head"><h3>Connection types</h3></div>
  <div class="card-body workplace-kinds-body">
    <div class="row workplace-kind-row">
      <span class="kind local">local</span>
      <div class="meta"><div class="title">Local process</div><div class="desc">Path on the Tomo host — bash/file tools use this root when assigned</div></div>
    </div>
    <div class="row workplace-kind-row">
      <span class="kind ssh">ssh</span>
      <div class="meta"><div class="title">SSH</div><div class="desc">Remote host with password or key (encrypted at rest) — Connect probes reachability</div></div>
    </div>
    <div class="row workplace-kind-row">
      <span class="kind tunnel">tunnel</span>
      <div class="meta"><div class="title">Tomo Connector</div><div class="desc">WebSocket tunnel — connector later (not fake-connected)</div></div>
    </div>
  </div>
</div>
