<div class="card workplace-kinds">
  <div class="card-head"><h3>Connection types</h3></div>
  <div class="card-body workplace-kinds-body">
    <div class="row workplace-kind-row">
      <span class="kind local">local</span>
      <div class="meta"><div class="title">Local process</div><div class="desc">Agent runs on the same host as Tomo</div></div>
    </div>
    <div class="row workplace-kind-row">
      <span class="kind tunnel">tunnel</span>
      <div class="meta"><div class="title">Tomo Connector</div><div class="desc">WebSocket tunnel — primary remote connection</div></div>
    </div>
    <div class="row workplace-kind-row">
      <span class="kind ssh">ssh</span>
      <div class="meta"><div class="title">SSH fallback</div><div class="desc">Direct shell access when tunnel unavailable</div></div>
    </div>
  </div>
</div>
