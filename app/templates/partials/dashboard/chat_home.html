{# Hallmark · Split Studio — composer (ask) | recent (proof) #}
<section class="chat-home" aria-label="Start a chat">
  <div class="chat-home-split">
    <div class="chat-home-ask">
      <p class="chat-home-kicker">友 · Tomo</p>
      <h1 class="chat-home-title">Message the swarm</h1>
      <p class="chat-home-sub">Ask anything. Tomo routes to the right agent — or @mention one.</p>

      <form class="chat-home-form" id="homeChatForm" autocomplete="off">
        <label class="chat-home-label" for="homeChatInput">New chat</label>
        <div class="chat-home-composer">
          <textarea
            id="homeChatInput"
            class="chat-home-input"
            rows="3"
            placeholder="Message Tomo…"
            aria-label="Message Tomo"
          ></textarea>
          <div class="chat-home-composer-bar">
            <p class="chat-home-route" id="homeChatRoute">
              via <strong id="homeCoordName">Tomo</strong>
            </p>
            <button type="submit" class="btn primary chat-home-send" id="homeChatSend" disabled>
              Send
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M5 12h14M13 6l6 6-6 6"/>
              </svg>
            </button>
          </div>
        </div>
      </form>
    </div>

    <aside class="chat-home-proof" aria-label="Recent chats">
      <div class="chat-home-recent-head">
        <span>Recent</span>
        <a class="chat-home-all" href="/sessions">All chats</a>
      </div>
      <div id="homeRecentChats" class="chat-home-recent-list">
        <div class="empty">Loading…</div>
      </div>
    </aside>
  </div>
</section>
