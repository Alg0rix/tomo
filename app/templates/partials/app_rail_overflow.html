{# Nav items tucked behind More on /sessions. #}
<a class="app-rail-item {{ 'active' if page in ('workplaces','workplace') }}" href="/workplaces" title="Workplaces" role="menuitem">
  <span class="app-rail-ico" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V9l8-5 8 5v11"/><path d="M9 20v-6h6v6"/></svg>
  </span>
  <span class="app-rail-label">Workplaces</span>
</a>
{% for item in module_nav|default([]) %}
{% if item.id == 'token_monitor' %}
<a class="app-rail-item {{ 'active' if page == item.page }}" href="{{ item.path }}" title="{{ item.label }}" role="menuitem">
  <span class="app-rail-ico" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>
  </span>
  <span class="app-rail-label">{{ item.label }}</span>
</a>
{% endif %}
{% endfor %}
<a class="app-rail-item {{ 'active' if page == 'scheduler' }}" href="/scheduler" title="Scheduler" role="menuitem">
  <span class="app-rail-ico" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><path d="M12 8v4.5L15 15"/></svg>
  </span>
  <span class="app-rail-label">Scheduler</span>
</a>
