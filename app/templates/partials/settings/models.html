<section id="sec-models" class="sys-section machine-station" style="display:none">
  <div class="machine-toolbar">
    <p class="machine-toolbar-label">LLM profiles</p>
    <button class="btn primary sm" type="button" id="addProfileBtn">New profile</button>
  </div>
  <p class="machine-note">Click a unit to inspect it on the bench. The catalog stays put.</p>
  <div class="machine-ledger" id="profileList">
    <div class="empty">Loading…</div>
  </div>

  <div class="machine-dock hidden" id="profileFormCard" role="dialog" aria-modal="true" aria-labelledby="profileFormTitle">
    <div class="machine-sheet-head">
      <h3 id="profileFormTitle">New profile</h3>
      <button class="btn ghost sm" type="button" data-dock-close>Close</button>
    </div>
    <form id="profileForm" autocomplete="off" onsubmit="return false;">
      <input type="hidden" id="profFormMode" value="add">
      <input type="hidden" id="profId" value="">
      <div class="machine-field">
        <div class="machine-field-copy"><div class="machine-field-name">Name</div></div>
        <div class="machine-field-control">
          <input class="input machine-input-mid" id="profName" required placeholder="Default">
        </div>
      </div>
      <div class="machine-field">
        <div class="machine-field-copy"><div class="machine-field-name">Base URL</div></div>
        <div class="machine-field-control machine-field-control-wide">
          <input class="input" type="url" id="profBaseUrl" placeholder="https://api.openai.com/v1" spellcheck="false">
        </div>
      </div>
      <div class="machine-field">
        <div class="machine-field-copy">
          <div class="machine-field-name">API key</div>
          <p class="machine-field-hint" id="profKeyStatus">Leave blank on edit to keep the existing key.</p>
        </div>
        <div class="machine-field-control machine-field-control-wide">
          <input class="input" type="password" id="profApiKey" placeholder="Paste key — encrypted at rest" autocomplete="new-password" spellcheck="false">
        </div>
      </div>
      <div class="machine-field">
        <div class="machine-field-copy"><div class="machine-field-name">Model</div></div>
        <div class="machine-field-control">
          <input class="input machine-input-mid" id="profModel" placeholder="gpt-4o-mini" spellcheck="false">
        </div>
      </div>
      <div class="machine-field machine-field-stack">
        <div class="machine-field-copy">
          <div class="machine-field-name">Reasoning efforts</div>
          <p class="machine-field-hint">One provider value per line. The last value is the default / highest effort.</p>
        </div>
        <div class="machine-field-control machine-field-control-wide">
          <textarea class="input machine-mono" id="profReasoningEfforts" rows="5" placeholder="low
medium
high
provider-max" spellcheck="false"></textarea>
        </div>
      </div>
      <div class="machine-field">
        <div class="machine-field-copy"><div class="machine-field-name">Enabled</div></div>
        <div class="machine-field-control">
          <label class="toggle"><input type="checkbox" id="profEnabled" checked><span class="track"></span></label>
        </div>
      </div>
      <div class="machine-sheet-foot">
        <button class="btn ghost" type="button" id="profCancel">Cancel</button>
        <button class="btn primary sm" type="button" id="profSave">Save profile</button>
      </div>
    </form>
  </div>
</section>
