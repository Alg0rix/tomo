<div id="newChatModal" class="modal hidden" aria-hidden="true">
  <div class="modal-backdrop" data-close="1"></div>
  <div class="modal-card modal-wide">
    <div class="modal-head"><h3>Custom chat</h3></div>
    <div class="modal-body">
      <p class="modal-lead">Default chats use the live swarm (every enabled agent, including ones you add later). Use this only for a fixed solo or limited set.</p>
      <div class="agent-pick-list" id="newChatAgents">
        {% for a in agents_list %}
        {% with agent=a, pick_checked=true %}{% include 'partials/agent_pick.html' %}{% endwith %}
        {% endfor %}
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn ghost" type="button" data-close="1">Cancel</button>
      <button class="btn primary" type="button" id="newChatConfirm">Start</button>
    </div>
  </div>
</div>

<div id="editSwarmModal" class="modal hidden" aria-hidden="true">
  <div class="modal-backdrop" data-close="2"></div>
  <div class="modal-card modal-wide">
    <div class="modal-head"><h3>Session agents</h3></div>
    <div class="modal-body">
      <div class="agent-pick-list" id="editSwarmAgents"></div>
    </div>
    <div class="modal-foot">
      <button class="btn ghost" type="button" data-close="2">Cancel</button>
      <button class="btn primary" type="button" id="editSwarmConfirm">Save</button>
    </div>
  </div>
</div>
