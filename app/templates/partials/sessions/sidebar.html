<aside class="sessions-sidebar" id="sessionsSidebar">
  <div class="sessions-sidebar-head">
    <div class="sessions-sidebar-title-row">
      <button type="button" class="icon-btn sessions-sidebar-toggle" id="sessionsSidebarCollapse"
              title="Hide chat history" aria-label="Hide chat history" aria-expanded="true"
              aria-controls="sessionList">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <rect x="3" y="4" width="18" height="16" rx="2"/>
          <path d="M9 4v16"/>
        </svg>
      </button>
      <h2>Chat</h2>
    </div>
    <div class="sessions-sidebar-actions">
      <button class="btn ghost sm" id="searchChatsBtn" type="button" title="Search chats">Search</button>
      <button class="btn ghost sm" id="newChatBtn" type="button" title="New chat — pick folder (default: Tomo work dir)">New</button>
    </div>
  </div>
  <div class="sessions-list" id="sessionList">
    <div class="empty">Loading sessions…</div>
  </div>
</aside>
<button type="button" class="sessions-sidebar-reopen hidden" id="sessionsSidebarExpand"
        title="Show chat history" aria-label="Show chat history" aria-expanded="false"
        aria-controls="sessionList">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
    <rect x="3" y="4" width="18" height="16" rx="2"/>
    <path d="M9 4v16"/>
  </svg>
</button>
