# Queued follow-ups survive a chat switch: parked on destroy, restored as
# queued bubbles when the chat reopens, then drained in order.
version: 1
steps:
  # No backend: every API call answers {}, chat streams fail.
  - unroute: true
  - route: {pattern: "**/api/**", status: 200, body: "{}", contentType: application/json}
  - route: {pattern: "**/chat/stream", status: 500, body: '{"detail":"offline"}', contentType: application/json}
  - open: "${BASE_URL}/chat.html"
  - name: reopen a chat with a parked queue
    eval: |
      (() => {
        const wrap = document.querySelector('.chat-wrap');
        wrap._tomoChatHandle.destroy();
        sessionStorage.setItem('tomo:chat-queue:s1', JSON.stringify([
          { text: 'first follow-up', attachmentIds: [], attachments: [] },
          { text: 'second', attachmentIds: [], attachments: [] },
        ]));
        TomoChat.init(wrap);
        const bubbles = [...wrap.querySelectorAll('.msg.user')].map(el => el.textContent);
        return check.equal(bubbles.length, 2, 'restored bubbles')
          && check.match(bubbles[0], /first follow-up/, 'first bubble')
          && check.match(bubbles[1], /second/, 'second bubble')
          && check.equal(sessionStorage.getItem('tomo:chat-queue:s1'), null, 'parked copy consumed');
      })()
  - name: switching away parks the queue again
    eval: |
      (() => {
        const wrap = document.querySelector('.chat-wrap');
        wrap._tomoChatHandle.destroy();
        wrap.dataset.sessionId = 's2';
        wrap.querySelector('.chat-scroll').innerHTML = '';
        TomoChat.init(wrap);
        const parked = JSON.parse(sessionStorage.getItem('tomo:chat-queue:s1') || '[]').map(q => q.text);
        return check.equal(parked, ['first follow-up', 'second'], 'parked')
          && check.equal(wrap.querySelectorAll('.msg.user').length, 0, 'other chat bubbles');
      })()
  - name: reopen the chat while idle
    eval: |
      (() => {
        const wrap = document.querySelector('.chat-wrap');
        wrap._tomoChatHandle.destroy();
        wrap.dataset.sessionId = 's1';
        wrap.querySelector('.chat-scroll').innerHTML = '';
        TomoChat.init(wrap);
        return true;
      })()
  - name: parked queue drains (collect stream POST bodies)
    repeat:
      until: {js: "posts.length >= 2"}
      max: 50
      steps:
        - eval: "window.posts = []; new Promise(r => setTimeout(r, 100))"
        - network: true
          save: net
        - each:
            items: "${net}"
            as: req
            steps:
              - if: {js: "'${req.item.method}' === 'POST' && '${req.item.url}'.endsWith('/chat/stream')"}
                then:
                  - request: "${req.item.index}"
                    save: sent
                  - eval: "posts.push(JSON.parse(String.raw`${sent.requestBody}`).message)"
  - name: drain order and cleanup
    eval: |
      check.equal(posts, ['first follow-up', 'second'], 'posts')
        && check.equal(sessionStorage.getItem('tomo:chat-queue:s1'), null, 'parked copy')
  - name: no page errors
    eval: check.noErrors()
