[project]
name = "tomo"
version = "0.2.1"
description = "Tomo (友達) — a general-purpose agent swarm that learns, coordinates, and acts on your behalf."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
    "jinja2>=3.1.6",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.32",
    "httpx>=0.28.1",
    "openai>=2.53.0",
    "cryptography>=50.0.0",
    "paramiko>=5.0.0",
    "beautifulsoup4>=4.15.0",
    "markitdown[docx]>=0.1.7",
    "pdf-inspector>=0.2.6",
    "apscheduler>=3.11.3,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "cli", "modules"]

[project.scripts]
tomo = "cli.__main__:main"

[tool.fastapi]
entrypoint = "app.main:app"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# Baseline flake8-equivalent rules so CI stays green; expand selectively later.
[tool.ruff]
target-version = "py312"
src = ["app", "cli", "modules", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
