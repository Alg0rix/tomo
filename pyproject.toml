[project]
name = "tomo"
version = "0.1.0"
description = "Tomo (友達) — a general-purpose agent swarm that learns, coordinates, and acts on your behalf."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "openai>=1.40",
    "cryptography>=42",
    "paramiko>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "cli"]

[project.scripts]
tomo = "cli.__main__:main"

[tool.fastapi]
entrypoint = "app.main:app"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# Baseline flake8-equivalent rules so CI stays green; expand selectively later.
[tool.ruff]
target-version = "py312"
src = ["app", "cli", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
