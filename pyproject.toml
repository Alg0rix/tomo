[project]
name = "tomo"
version = "0.3.3"
description = "Tomo (友達) — a general-purpose agent swarm that learns, coordinates, and acts on your behalf."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "jinja2>=3.1.6",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.32",
    "python-dotenv>=1.2.4",
    "httpx>=0.28.1",
    "httpx2>=2.16.0,<3",
    "openai>=3.40.0",
    "cryptography>=50.0.2",
    "paramiko>=5.1.0",
    "beautifulsoup4>=4.15.0",
    "markitdown[docx]>=0.1.9",
    "pdf-inspector>=1.25.2",
    "apscheduler>=3.11.3,<4",
    "firecrawl-anydoc>=0.2.4",
    "mcp>=2.3.0,<3",
    "markdown-it-py>=4.2.0,<5",
    "wsproto>=1.3.2,<2",
    "pillow>=13.0.0",
    "packaging>=26.3,<27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "cli"]

[project.scripts]
tomo = "cli.__main__:main"

[tool.fastapi]
entrypoint = "app.main:app"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = ["-n", "auto", "--dist=loadfile"]
markers = [
    "integration: tests that drive the full app/store stack",
    "slow: unusually slow tests",
]

# Baseline flake8-equivalent rules so CI stays green; expand selectively later.
[tool.ruff]
target-version = "py312"
src = ["app", "cli", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
