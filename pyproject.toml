[project]
name = "tomo"
version = "0.1.0"
description = "Tomo (友達) — a general-purpose agent swarm that learns, coordinates, and acts on your behalf."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "cryptography>=42",
    "paramiko>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "cli"]

[project.scripts]
tomo = "cli.__main__:main"

[tool.fastapi]
entrypoint = "app.main:app"

[tool.uv]
package = true

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
