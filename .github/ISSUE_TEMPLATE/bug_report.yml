name: Bug report
description: Report a bug or unexpected behavior in Tomo
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Fill in as much as you can so we can reproduce it.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What went wrong?
      placeholder: A clear summary of the bug…
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps that trigger the issue.
      placeholder: |
        1. Start Tomo with …
        2. Open …
        3. Do …
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: What happened instead? Include error messages or logs if you have them.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of Tomo is involved?
      multiple: true
      options:
        - Agents / coordinator
        - Channels (Web UI / Telegram)
        - Tools / skills
        - Memory / knowledge base / learning
        - Workplaces (local / tunnel / SSH)
        - Connector
        - Install / setup
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Tomo version / commit
      description: Release tag, branch, or git commit SHA if known.
      placeholder: e.g. main @ abc1234
    validations:
      required: false

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, how you run Tomo (Docker, venv, etc.).
      placeholder: e.g. Ubuntu 24.04, Python 3.12, uvicorn
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Paste relevant logs (trim secrets). Drag images here if useful.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and did not find a duplicate
          required: true
        - label: I am not including secrets (API keys, tokens, passwords) in this report
          required: true
