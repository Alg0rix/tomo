name: Tomo CodeQL

paths-ignore:
  - "tmp/**"
  - "benchmarks/**"

# Product surfaces CodeQL cannot model as safe:
# - connector background jobs intentionally run agent shell commands
# - API key storage fingerprints high-entropy tokens (not password hashing)
query-filters:
  - exclude:
      id: go/command-injection
  - exclude:
      id: py/weak-sensitive-data-hashing
