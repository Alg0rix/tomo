name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  connector:
    name: connector (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            ext: ""
          - goos: darwin
            goarch: amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            ext: ""
          - goos: windows
            goarch: amd64
            ext: ".exe"
          - goos: windows
            goarch: arm64
            ext: ".exe"
    defaults:
      run:
        working-directory: connector
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: connector/go.mod
          cache-dependency-path: connector/go.sum

      - name: Test
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: go test -race ./...

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          out="dist/tomo-connector-${GOOS}-${GOARCH}${{ matrix.ext }}"
          go build -trimpath -ldflags="-s -w" -o "$out" ./cmd/tomo-connector
          ls -lh "$out"

      - uses: actions/upload-artifact@v7
        with:
          name: tomo-connector-${{ matrix.goos }}-${{ matrix.goarch }}
          path: connector/dist/tomo-connector-*
          if-no-files-found: error

  python:
    name: python (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      # Tunnel integration tests build the real connector; do not silently skip them.
      - uses: actions/setup-go@v7
        with:
          go-version-file: connector/go.mod
          cache-dependency-path: connector/go.sum

      - name: Sync deps
        run: uv sync --locked --group dev

      # Runtime/terminal/tool and document-conversion tests exercise the real
      # restricted backend. A Docker daemon alone is not enough: without the
      # full-toolchain image, conversion correctly fails closed with 503.
      - name: Build restricted sandbox
        run: |
          docker info
          docker build -t tomo:local .
          docker build -f Dockerfile.full \
            --build-arg TOMO_BASE_IMAGE=tomo:local -t tomo:local-full .
          docker build -f Dockerfile.sandbox \
            --build-arg TOMO_FULL_IMAGE=tomo:local-full -t tomo:sandbox .
          docker image inspect tomo:sandbox

      - name: Test
        run: uv run pytest -q --durations=20

      - name: Build wheel
        if: matrix.python-version == '3.12'
        run: uv build --wheel

      - uses: actions/upload-artifact@v7
        if: matrix.python-version == '3.12'
        with:
          name: tomo-python-wheel
          path: dist/*.whl
          if-no-files-found: error

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [connector, python, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: tomo-*
          merge-multiple: true

      - name: Checksums
        run: |
          cd artifacts
          sha256sum tomo-connector-* tomo-*.whl > SHA256SUMS
          ls -lh
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/tomo-connector-*
            artifacts/tomo-*.whl
            artifacts/SHA256SUMS
          generate_release_notes: true

  docker:
    name: docker (ghcr)
    # Publish images only for version tags, never main pushes or PRs.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [python]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Image name (lowercase)
        id: image
        run: |
          echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # "full" variant: slim image + agent toolchain (Dockerfile.full).
      # Runs after the slim push so it can layer on the just-published image.
      - name: Base image ref for full build
        id: base
        run: |
          echo "ref=${{ steps.image.outputs.name }}:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@v5
        id: meta-full
        with:
          images: ${{ steps.image.outputs.name }}
          # Keep the slim :latest alias intact; full has its own :full alias.
          flavor: latest=false
          tags: |
            type=raw,value=full
            type=semver,pattern={{version}}-full
            type=semver,pattern={{major}}.{{minor}}-full
            type=sha,prefix=sha-,suffix=-full

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.full
          push: true
          build-args: |
            TOMO_BASE_IMAGE=${{ steps.base.outputs.ref }}
          tags: ${{ steps.meta-full.outputs.tags }}
          labels: ${{ steps.meta-full.outputs.labels }}
          cache-from: type=gha,scope=full
          cache-to: type=gha,scope=full,mode=max
