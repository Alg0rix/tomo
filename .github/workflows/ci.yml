name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  connector:
    name: connector (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            ext: ""
          - goos: darwin
            goarch: amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            ext: ""
          - goos: windows
            goarch: amd64
            ext: ".exe"
          - goos: windows
            goarch: arm64
            ext: ".exe"
    defaults:
      run:
        working-directory: connector
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: connector/go.mod
          cache-dependency-path: connector/go.sum

      - name: Test
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: go test ./...

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          out="dist/tomo-connector-${GOOS}-${GOARCH}${{ matrix.ext }}"
          go build -trimpath -ldflags="-s -w" -o "$out" ./cmd/tomo-connector
          ls -lh "$out"

      - uses: actions/upload-artifact@v7
        with:
          name: tomo-connector-${{ matrix.goos }}-${{ matrix.goarch }}
          path: connector/dist/tomo-connector-*
          if-no-files-found: error

  python:
    name: python (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Sync deps
        run: uv sync --group dev

      - name: Test
        run: uv run pytest -q

      - name: Build wheel
        if: matrix.python-version == '3.12'
        run: uv build --wheel

      - uses: actions/upload-artifact@v7
        if: matrix.python-version == '3.12'
        with:
          name: tomo-python-wheel
          path: dist/*.whl
          if-no-files-found: error

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [connector, python]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: tomo-*
          merge-multiple: true

      - name: Checksums
        run: |
          cd artifacts
          sha256sum tomo-connector-* tomo-*.whl > SHA256SUMS
          ls -lh
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/tomo-connector-*
            artifacts/tomo-*.whl
            artifacts/SHA256SUMS
          generate_release_notes: true
